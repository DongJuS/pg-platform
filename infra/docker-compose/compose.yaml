name: pg-platform-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside the repository}
      POSTGRES_DB: transfer_db
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_local -d transfer_db"]
      interval: 3s
      retries: 40
    mem_limit: 512m
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD outside the repository}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_nopad_bin"]
    ports: ["127.0.0.1:23306:3306"]
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 40
    mem_limit: 512m
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:26379:6379"]
    command: [redis-server, --appendonly, 'yes']
    volumes: ["redisdata:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 40
    mem_limit: 128m
  kafka-volume-init:
    image: apache/kafka-native:4.0.1
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh, -c]
    command: ["chown 1000:1000 /var/lib/kafka/data"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes: ["kafkadata:/var/lib/kafka/data"]
    mem_limit: 32m
  kafka:
    image: apache/kafka-native:4.0.1
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:29092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:29092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/localhost/19092'"]
      start_period: 15s
      interval: 3s
      retries: 40
    mem_limit: 512m
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:29090:9090"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    mem_limit: 192m
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD outside the repository}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ["127.0.0.1:23000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/sources.yml:ro
    mem_limit: 256m
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["127.0.0.1:24317:4317", "127.0.0.1:24318:4318"]
    volumes: ["../observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro"]
    mem_limit: 192m
  transfer:
    profiles: [smoke]
    image: eclipse-temurin:21-jre-alpine
    working_dir: /app
    command: [java, -XX:MaxRAMPercentage=65, -jar, /app/app.jar]
    ports: ["127.0.0.1:18084:8084"]
    volumes: ["../../main-vpc/core/transfer/build/libs/transfer-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transfer_db
      DB_USERNAME: platform_local
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACE_SAMPLING_PROBABILITY: 1.0
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 512m
  account:
    profiles: [db-smoke]
    image: eclipse-temurin:21-jre-alpine
    working_dir: /app
    command: [java, -XX:MaxRAMPercentage=65, -jar, /app/app.jar]
    ports: ["127.0.0.1:18082:8082"]
    volumes: ["../../main-vpc/core/account/build/libs/account-0.1.0-SNAPSHOT.jar:/app/app.jar:ro"]
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/account_db
      DB_USERNAME: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      mariadb: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 512m
volumes:
  pgdata:
  mariadbdata:
  redisdata:
  kafkadata:
  prometheusdata:
  grafanadata:
