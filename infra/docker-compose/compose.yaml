name: pg-platform-local

# Shared environment blocks for the platform services. These names are the ones the
# service application.yml files and build-logic shared resources actually read.
x-otel-env: &otel-env
  OTEL_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  TRACE_SAMPLING_PROBABILITY: "1.0"

x-infra-env: &infra-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  REDIS_HOST: redis
  REDIS_PORT: "6379"

# Base tuning for the actuator healthcheck. The per-service `test` line still has to be
# set because the container port differs per service.
x-hc-base: &hc-base
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

# Image build contract. infra/docker/Dockerfile.service and its JAR_PATH build arg are
# owned by another workstream; the path and the ARG name are fixed by contract.
x-service-build: &service-build
  context: "../.."
  dockerfile: infra/docker/Dockerfile.service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside the repository}
      POSTGRES_DB: transfer_db
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform_local -d transfer_db"]
      interval: 3s
      retries: 40
    mem_limit: 512m
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD outside the repository}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_nopad_bin"]
    ports: ["127.0.0.1:23306:3306"]
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./mariadb-init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 40
    mem_limit: 512m
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:26379:6379"]
    command: [redis-server, --appendonly, 'yes']
    volumes: ["redisdata:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 40
    mem_limit: 128m
  kafka-volume-init:
    image: apache/kafka-native:4.0.1
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh, -c]
    command: ["chown 1000:1000 /var/lib/kafka/data"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes: ["kafkadata:/var/lib/kafka/data"]
    mem_limit: 32m
  kafka:
    image: apache/kafka-native:4.0.1
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:29092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:29092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/localhost/19092'"]
      start_period: 15s
      interval: 3s
      retries: 40
    mem_limit: 512m
  kafka-init:
    # Creates the event topics because KAFKA_AUTO_CREATE_TOPICS_ENABLE=false.
    # Idempotent: --create --if-not-exists. Uses the JVM image because the
    # apache/kafka-native broker image ships no CLI scripts.
    image: apache/kafka:3.9.1
    entrypoint: [/bin/sh, /init/kafka-topics.sh]
    environment:
      KAFKA_HEAP_OPTS: -Xms32m -Xmx96m
    volumes: ["./kafka-topics.sh:/init/kafka-topics.sh:ro"]
    depends_on:
      kafka: {condition: service_healthy}
    mem_limit: 192m
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:29090:9090"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    mem_limit: 192m
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD outside the repository}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ["127.0.0.1:23000:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/sources.yml:ro
    mem_limit: 256m
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["127.0.0.1:24317:4317", "127.0.0.1:24318:4318"]
    volumes: ["../observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro"]
    mem_limit: 192m
  alertmanager:
    # Config file is owned by another workstream (contract path). The `observability`
    # profile keeps the default startup working until the file exists.
    profiles: [observability]
    image: prom/alertmanager:v0.34.1
    ports: ["127.0.0.1:29093:9093"]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    mem_limit: 64m
  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yml"]
    ports: ["127.0.0.1:23200:3200"]
    volumes:
      - ../observability/tempo.yml:/etc/tempo.yml:ro
      - tempodata:/var/tempo
    mem_limit: 256m
  loki:
    profiles: [observability]
    image: grafana/loki:3.6.18
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["127.0.0.1:23100:3100"]
    volumes:
      - ../observability/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    mem_limit: 256m
  promtail:
    profiles: [observability]
    image: grafana/promtail:3.6.11
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtaildata:/data
    depends_on:
      loki: {condition: service_started}
    mem_limit: 64m
  localstack:
    # Local stand-in for Amazon S3 (wealth-report report PDFs). S3 only.
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      PERSISTENCE: "1"
    ports: ["127.0.0.1:24566:4566"]
    volumes: ["localstackdata:/var/lib/localstack"]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"' || curl -fsS http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"'"]
      interval: 3s
      retries: 40
    mem_limit: 512m
  localstack-init:
    # Creates the local report bucket. Idempotent: head-bucket check before mb.
    image: localstack/localstack:3
    entrypoint: [/bin/sh, /init/s3-init.sh]
    environment:
      REPORT_BUCKET: ${REPORT_BUCKET:-pg-platform-local-reports}
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes: ["./s3-init.sh:/init/s3-init.sh:ro"]
    depends_on:
      localstack: {condition: service_healthy}
    mem_limit: 64m

  # ---------------------------------------------------------------------------
  # Platform services (profile: platform). Image build contract:
  #   image: pg-platform/<service>:local
  #   build: infra/docker/Dockerfile.service with JAR_PATH=<module>/build/libs/<service>-0.1.0-SNAPSHOT.jar
  # transfer/account keep their smoke/db-smoke profiles so the existing README flows
  # keep working with the same service names.
  # ---------------------------------------------------------------------------
  api-gateway:
    profiles: [platform]
    image: pg-platform/api-gateway:local
    build:
      <<: *service-build
      args:
        JAR_PATH: main-vpc/channel/api-gateway/build/libs/api-gateway-0.1.0-SNAPSHOT.jar
    ports: ["127.0.0.1:18080:8080"]
    environment:
      <<: *otel-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      <<: *hc-base
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health | grep -q UP || wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    mem_limit: 512m
  auth:
    profiles: [platform]
    image: pg-platform/auth:local
    build:
      <<: *service-build
      args:
        JAR_PATH: main-vpc/core/auth/build/libs/auth-0.1.0-SNAPSHOT.jar
    ports: ["127.0.0.1:18081:8081"]
    environment:
      <<: [*otel-env, *infra-env]
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: platform_local
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *hc-base
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/actuator/health | grep -q UP || wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
    mem_limit: 512m
  account:
    profiles: [db-smoke, platform]
