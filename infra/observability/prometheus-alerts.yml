# [MVP2-F12] PG 플랫폼 통합 알림 룰.
# 모든 임계값은 "초기값/튜닝 대상"이다. 실제 금융 트래픽 기준 SLO가 확정되기 전까지
# 운영 기준으로 간주하지 않는다. 근거 메트릭 규약은 METRICS.md, 대응 절차는 RUNBOOK.md 참조.
#
# 메트릭 소스 현황:
#   - http_server_requests_seconds_* : Spring Actuator가 이미 노출(스켈레톤 포함).
#   - up                             : Prometheus 스크레이프 결과.
#   - kafka_consumer_fetch_manager_records_lag_max : spring-kafka Micrometer 바인딩이
#     켜져 있을 때만 존재. 노출 여부 "확인 필요"(RUNBOOK.md 참조).
#   - pg_outbox_* : 로컬 OutboxStore/JDBC/MeterRegistry가 있는 서비스에서 구현.
#   - pg_payment_reconciliation_mismatch_total : 실제 대사 결과 commit 후 증가한다.
groups:
  - name: platform-availability
    interval: 30s
    rules:
      # 알림 파이프라인 자체가 살아 있는지 확인하는 상시 발화 룰.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
        annotations:
          summary: "Alertmanager 파이프라인 감시용 상시 발화"
          description: "항상 발화하는 룰. Alertmanager에 이 알림이 보이지 않으면 Prometheus→Alertmanager 연결이 끊긴 것이다."
          runbook_url: "infra/observability/RUNBOOK.md#watchdog"

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "서비스 다운: {{ $labels.service }}"
          description: "인스턴스 {{ $labels.instance }}(service={{ $labels.service }}, job={{ $labels.job }})가 2분 이상 스크레이프에 응답하지 않는다."
          runbook_url: "infra/observability/RUNBOOK.md#servicedown"

  - name: http-service
    interval: 30s
    rules:
      - alert: HighHttp5xxErrorRate
        # 초기값/튜닝 대상: 5분 윈도우 5xx 비율 2% 초과 시 warning.
        expr: |
          sum by (service, job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (service, job) (rate(http_server_requests_seconds_count[5m]))
            > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "5xx 오류율 상승: {{ $labels.service }}"
          description: "service={{ $labels.service }}의 5xx 비율이 10분간 2%(초기값)를 초과했다. 현재 {{ $value | humanizePercentage }}."
          runbook_url: "infra/observability/RUNBOOK.md#highhttp5xxerrorrate"

      - alert: HighLatencyP95
        # 초기값/튜닝 대상: p95 > 1s. 금융 산식·SLO 미확정이므로 보수적 탐지용.
        expr: |
          histogram_quantile(0.95,
            sum by (service, job, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "지연 p95 상승: {{ $labels.service }}"
          description: "service={{ $labels.service }}의 HTTP p95가 10분간 1s(초기값)를 초과했다. 현재 {{ $value }}s."
          runbook_url: "infra/observability/RUNBOOK.md#highlatencyp95p99"

      - alert: HighLatencyP99
        # 초기값/튜닝 대상: p99 > 2s.
        expr: |
          histogram_quantile(0.99,
            sum by (service, job, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "지연 p99 상승: {{ $labels.service }}"
          description: "service={{ $labels.service }}의 HTTP p99가 10분간 2s(초기값)를 초과했다. 현재 {{ $value }}s."
          runbook_url: "infra/observability/RUNBOOK.md#highlatencyp95p99"

  - name: messaging
    interval: 30s
    rules:
      - alert: KafkaConsumerLagHigh
        # 초기값/튜닝 대상: 토픽·그룹 단위 최대 lag 1000건 초과.
        # 메트릭 kafka_consumer_fetch_manager_records_lag_max는 spring-kafka의
        # Micrometer 바인딩이 활성화된 경우에만 존재한다. 노출 여부 "확인 필요".
        # Kafka exporter(AWS 이전 시 MSK와 함께 검토) 도입 시 kafka_consumergroup_lag로 교체.
        expr: |
          max by (service, job, topic, client_id) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag 누적: {{ $labels.topic }}"
          description: "consumer={{ $labels.client_id }}가 topic={{ $labels.topic }}에서 15분간 lag 1000건(초기값)을 초과했다. 현재 {{ $value }}건."
          runbook_url: "infra/observability/RUNBOOK.md#kafkaconsumerlaghigh"

      # relay 활성 여부와 무관하게 서비스 로컬 DB에서 수집한다.
      - alert: OutboxBacklogHigh
        # 초기값/튜닝 대상: 미발행 outbox_events 누적 500건 초과.
        expr: pg_outbox_unpublished_events > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox 미발행 누적: {{ $labels.service }}"
          description: "service={{ $labels.service }}의 미발행 outbox 이벤트가 10분간 500건(초기값)을 초과했다. 현재 {{ $value }}건. relay(DB 폴링) 정지 또는 Kafka 장애 가능성."
          runbook_url: "infra/observability/RUNBOOK.md#outboxbacklog"

      - alert: OutboxOldestEventStale
        # 초기값/튜닝 대상: 가장 오래된 미발행 이벤트의 나이 5분 초과.
        expr: pg_outbox_oldest_unpublished_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox 최장 미발행 이벤트 정체: {{ $labels.service }}"
          description: "service={{ $labels.service }}의 가장 오래된 미발행 outbox 이벤트가 {{ $value }}초째 발행되지 않았다(초기값 임계 300s)."
          runbook_url: "infra/observability/RUNBOOK.md#outboxbacklog"

      - alert: OutboxMetricsUnavailable
        expr: pg_outbox_metrics_sample_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox DB 지표 수집 실패: {{ $labels.service }}"
          description: "최근 Outbox DB 표본이 2분간 실패했다. 미발행 건수와 나이를 정상 0으로 해석하지 않는다."
          runbook_url: "infra/observability/RUNBOOK.md#outboxbacklog"

      - alert: ReconciliationMismatch
        # Payment 대사 결과와 연결된 실제 Counter. 불일치는 건수와 무관하게 즉시 조사 대상.
        expr: increase(pg_payment_reconciliation_mismatch_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "대사 불일치 감지: {{ $labels.service }}"
          description: "최근 10분 내 대사 불일치가 {{ $value }}건 기록됐다. 불일치 유형·금액 산식은 미정이므로 런북에 따라 원인 조사부터 수행한다."
          runbook_url: "infra/observability/RUNBOOK.md#reconciliationmismatch"
