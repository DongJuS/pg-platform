# [MVP2-F12] Grafana 대시보드 provisioning.
# compose 반영 계약(다른 작업자 소유 compose.yaml에 요청할 마운트):
#   infra/observability/dashboards/ → /etc/grafana/provisioning/dashboards/
# 이 파일과 *.json이 같은 디렉터리에 있어야 provider가 대시보드를 읽는다.
apiVersion: 1
providers:
  - name: pg-platform
    orgId: 1
    folder: "PG Platform"
    folderUid: pg-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
