# Shared collector config, mounted by the base stack (infra/docker/compose.yaml).
# Traces/metrics only — intentionally no logs pipeline: adding otlphttp/loki here
# would make the base-only collector retry forever against a nonexistent loki.
# compose.observability.yaml swaps this mount for
# infra/docker/config/otel-collector.observability.yml, which adds the logs pipeline.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 120
  batch: {}
exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
  # [MVP2-F12] traces를 Tempo로 전달(OTLP gRPC). tempo.yml 참조.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
