# Fixed local-development TCP forwards, not an application Gateway or an outbound proxy.
# Resolve dynamically so unselected app profiles need not exist at proxy startup.
global
    log stdout format raw local0
    maxconn 1024

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m

resolvers docker
    nameserver docker-dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s

listen access-api-gateway
    bind :8080
    server api-gateway api-gateway:8080 resolvers docker init-addr none

listen access-auth
    bind :8081
    server auth auth:8081 resolvers docker init-addr none

