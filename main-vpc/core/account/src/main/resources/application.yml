spring:
  application:
    name: account
  config:
    import: classpath:platform-defaults.yml,classpath:platform-infra.yml
server:
  port: ${SERVER_PORT:8082}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:23306/account_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
