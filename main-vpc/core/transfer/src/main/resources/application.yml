spring:
  application:
    name: transfer
  config:
    import: classpath:platform-defaults.yml,classpath:platform-infra.yml
  kafka:
    consumer:
      # ledger.posted는 Outbox relay가 byte[]로 발행한다(ByteArraySerializer — platform-infra.yml).
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
server:
  port: ${SERVER_PORT:8084}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/transfer_db}
    username: ${DB_USERNAME:platform_local}
    password: ${DB_PASSWORD}
