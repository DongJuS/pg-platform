spring:
  application:
    name: auth
  config:
    import: classpath:platform-defaults.yml,classpath:platform-infra.yml
server:
  port: ${SERVER_PORT:8081}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/auth_db}
    username: ${DB_USERNAME:platform_local}
    password: ${DB_PASSWORD}
