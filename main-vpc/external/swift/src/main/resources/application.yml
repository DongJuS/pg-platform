spring:
  application:
    name: swift
  config:
    import: classpath:platform-defaults.yml,classpath:platform-infra.yml
  kafka:
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
server:
  port: ${SERVER_PORT:8087}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/swift_db}
    username: ${DB_USERNAME:platform_local}
    password: ${DB_PASSWORD}
