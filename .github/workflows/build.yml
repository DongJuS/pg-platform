name: Build and architecture rules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test local operations REST API contracts
        run: python3 -m unittest discover -s infra/docker -p 'test_ops_api.py' -v
      - run: ./gradlew build -Pintegration=true --no-daemon
      - name: Verify Outbox alert firing and recovery
        run: >-
          docker run --rm --network none --memory 256m
          --entrypoint /bin/promtool
          -v "$PWD/infra/observability:/rules:ro" -w /rules
          prom/prometheus:v3.5.0 test rules prometheus-alerts.test.yml
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.16.6'
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/envs/dev validate
      - name: Verify isolated NAT and internal FEP routes with mocked AWS
        shell: bash
        run: |
          for module in network security; do
            cp infra/terraform/envs/dev/.terraform.lock.hcl "infra/terraform/modules/$module/.terraform.lock.hcl"
            terraform -chdir="infra/terraform/modules/$module" init -backend=false -lockfile=readonly
            terraform -chdir="infra/terraform/modules/$module" test
          done

  # CMN-F03: package all 16 services as Docker images (build only, no push).
  # The Docker image is the deployment unit; tags are immutable (git SHA).
  docker-images:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build bootJars and package 16 service images
        # scripts/build-images.sh runs `./gradlew :<svc>:bootJar -x test` for
        # every service in infra/docker/services.tsv, then
        # `docker build -f infra/docker/Dockerfile.service --build-arg JAR_PATH=...`
        # tagged pg-platform/<service>:${GITHUB_SHA::8}. Nothing is pushed.
        run: bash scripts/build-images.sh --tag "${GITHUB_SHA::8}"
      - name: List built images
        run: docker image ls 'pg-platform/*'

  # Future (AWS readiness): push immutable tags to ECR and roll ECS services.
  # Disabled on purpose until AWS credentials/environments are approved.
  # Enable by removing `if: ${{ false }}` and uncommenting the steps.
  ecr-push-ecs-deploy:
    if: ${{ false }}
    needs: docker-images
    runs-on: ubuntu-latest
    permissions:
      id-token: write # future OIDC role assumption
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      # - uses: aws-actions/configure-aws-credentials@v4
