name: Build and architecture rules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew build -Pintegration=true --no-daemon
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.16.6'
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/envs/dev validate
      - name: Verify isolated NAT and internal FEP routes with mocked AWS
        shell: bash
        run: |
          for module in network security; do
            cp infra/terraform/envs/dev/.terraform.lock.hcl "infra/terraform/modules/$module/.terraform.lock.hcl"
            terraform -chdir="infra/terraform/modules/$module" init -backend=false -lockfile=readonly
            terraform -chdir="infra/terraform/modules/$module" test
          done
